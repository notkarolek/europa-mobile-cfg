<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Europa RP Launcher</title>
<style>
@font-face {
    font-family: 'ClashDisplay';
    src: url('./web/ClashDisplay-Semibold.otf') format('opentype');
    font-weight: 600;
    font-style: normal;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'ClashDisplay', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #000000;
    padding: 20px;
}

.container {
    display: flex;
    align-items: center;
    gap: 60px;
    max-width: 900px;
    width: 100%;
    background: #11162b;
    padding: 50px;
    border-radius: 12px;
    border: 1px solid #1e2540;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
}

.content {
    flex: 1;
    text-align: center;
}

h2 {
    font-family: 'ClashDisplay', sans-serif;
    font-size: 2.8rem;
    font-weight: 600;
    color: #e8ecf4;
    letter-spacing: 1px;
    margin-bottom: 8px;
}

.tagline {
    font-family: 'ClashDisplay', sans-serif;
    font-size: 1.1rem;
    font-weight: 400;
    color: #7a82a8;
    margin-bottom: 20px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.details {
    font-family: 'ClashDisplay', sans-serif;
    font-size: 1.15rem;
    font-weight: 400;
    color: #a8b0d0;
    line-height: 1.8;
    margin-bottom: 30px;
}

.details span {
    font-weight: 300;
    color: #5a6288;
}

.btn {
    font-family: 'ClashDisplay', sans-serif;
    font-weight: 600;
    background: #6b9fff;
    border: none;
    padding: 16px 56px;
    border-radius: 6px;
    font-size: 1.2rem;
    color: #0b0e1a;
    cursor: pointer;
    transition: background 0.2s ease;
    letter-spacing: 0.5px;
}

.btn:hover {
    background: #5a8eef;
}

.btn:active {
    background: #4a7ddf;
}

.coming {
    font-family: 'ClashDisplay', sans-serif;
    font-weight: 400;
    margin-top: 20px;
    font-size: 0.95rem;
    color: #5a6288;
    letter-spacing: 0.5px;
}

.coming strong {
    font-weight: 600;
    color: #7a82a8;
}

@media (max-width: 768px) {
    .container {
        flex-direction: column;
        padding: 35px 25px;
        gap: 0;
        max-width: 420px;
    }

    h2 {
        font-size: 2.2rem;
    }

    .btn {
        padding: 14px 44px;
        font-size: 1.05rem;
    }
}
</style>
</head>
<body>
<div class="container">
    <div class="content">
        <h2>Europa RP Launcher</h2>
        <div class="tagline">Version 1.4.0</div>
        <div class="details">
            <span>Size:</span> 29mb<br>
            <span>Arch:</span> armeabi-v7a [32Bit]<br>
            <span>AndroidSDK:</span> 21-35
        </div>
        <a href="launcher_new/app-debug.apk"><button class="btn">Download</button></a>
        <div class="coming"><strong>Version 1.4.1</strong> Coming Soon!</div>
    </div>
</div>
</body>
</html>
